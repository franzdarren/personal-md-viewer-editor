<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Write Markdown and see it rendered live. Edit either side; everything saves in your browser." />
    <title>Tinta — Markdown live preview</title>
    <script>
      // Apply the saved theme before first paint so there is no light-mode flash.
      try {
        var s = JSON.parse(localStorage.getItem('tinta:settings') || '{}');
        var t = s.theme || 'system';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
